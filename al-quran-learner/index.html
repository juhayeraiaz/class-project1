<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al-Quran Learner</title>
<meta name="description" content="একদম শুরু থেকে বাংলায় কুরআন পড়া শিখুন — হরফ, হরকত, তাজবীদ ও ছোট সূরা, শুনে শুনে।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap">
<style>
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --surface-2:#F5F8F5; --ink:#15251F; --muted:#56675F;
  --line:#D5DED8; --accent:#0E6A50; --accent-ink:#FFFFFF; --accent-soft:#DCEDE5;
  --gold:#A87718; --gold-soft:#F6EBD3; --heavy:#9A3B2E; --heavy-soft:#F7E3DF;
  --ok:#1E7A45; --bad:#B23A2E; --shadow:0 1px 2px rgba(20,40,32,.06),0 4px 14px rgba(20,40,32,.06);
  --ar:"Amiri Quran","Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;
  --bn:"Hind Siliguri","Noto Sans Bengali","Vrinda",system-ui,sans-serif;
  --disp:"Tiro Bangla","Hind Siliguri","Noto Serif Bengali",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1613; --surface:#16211D; --surface-2:#1B2823; --ink:#E4EDE8; --muted:#9CAEA5;
    --line:#2A3A33; --accent:#46BD92; --accent-ink:#06140F; --accent-soft:#1D3A2F;
    --gold:#E2B559; --gold-soft:#33291A; --heavy:#EE8A78; --heavy-soft:#3A221D;
    --ok:#5BD08C; --bad:#F07A6C; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1613; --surface:#16211D; --surface-2:#1B2823; --ink:#E4EDE8; --muted:#9CAEA5;
  --line:#2A3A33; --accent:#46BD92; --accent-ink:#06140F; --accent-soft:#1D3A2F;
  --gold:#E2B559; --gold-soft:#33291A; --heavy:#EE8A78; --heavy-soft:#3A221D;
  --ok:#5BD08C; --bad:#F07A6C; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--bn);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.ar{font-family:var(--ar);direction:rtl;font-feature-settings:"calt","liga"}
h1,h2,h3{font-family:var(--disp);font-weight:400;text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:20px;height:20px}
.bar-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speed{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--surface)}
.speed button{border:0;background:transparent;padding:7px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.speed button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

main{max-width:780px;margin:0 auto;padding:18px 16px 60px}
.stack{display:flex;flex-direction:column;gap:16px}

/* home hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:22px 20px;border-radius:18px;background:var(--accent);color:var(--accent-ink);overflow:hidden;position:relative}
.hero h1{font-size:clamp(26px,6vw,34px)}
.hero .sub{opacity:.85;font-size:14px;margin-top:4px}
.hero .iqra{font-family:var(--ar);font-size:clamp(54px,14vw,84px);line-height:1.2;direction:rtl}
.hero .iqra small{display:block;font-family:var(--bn);font-size:12px;text-align:center;opacity:.8;direction:ltr}
.prog{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:14px}
.prog-track{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);overflow:hidden}
.prog-fill{height:100%;background:var(--gold-soft);border-radius:99px;transition:width .4s}
:root[data-theme="dark"] .prog-fill{background:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .prog-fill{background:var(--accent-ink)}}

.note{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.note.warn{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));background:var(--gold-soft)}
.note h3{font-family:var(--bn);font-weight:600;font-size:16px}
.note ul{margin:0;padding-left:20px;font-size:14.5px}
.note .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.small{font-size:13.5px;color:var(--muted)}

.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.step:hover{border-color:var(--accent);transform:translateY(-1px)}
.num{width:44px;height:44px;display:grid;place-items:center;position:relative;font-family:var(--disp);font-size:17px;color:var(--accent)}
.num svg{position:absolute;inset:0;width:44px;height:44px}
.num svg path{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.step.done .num svg path{fill:var(--accent)}
.step.done .num{color:var(--accent-ink)}
.step-t{font-weight:600;font-size:16.5px;line-height:1.35}
.step-d{font-size:13.5px;color:var(--muted);line-height:1.45}
.step-ar{font-family:var(--ar);font-size:26px;color:var(--gold);direction:rtl;min-width:56px;text-align:center}
.part{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-top:8px}

/* lesson */
.lead{font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:21px;margin-bottom:6px}
.card h3{font-family:var(--bn);font-weight:600;font-size:17px;margin-bottom:4px}
.tip{border-left:4px solid var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;color:var(--muted)}
.legend b{color:var(--ink)}

.grid{display:grid;gap:8px;direction:rtl}
.g-letters{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.g-syl{grid-template-columns:repeat(3,1fr)}
.g-words{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:8px 4px 8px;min-height:84px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;direction:ltr}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.97)}
.tile .a{font-family:var(--ar);font-size:36px;line-height:1.5;direction:rtl}
.tile .b{font-size:13px;color:var(--muted);line-height:1.2}
.tile .m{font-size:12px;color:var(--muted);line-height:1.3;text-align:center}
.tile.heavy .a{color:var(--heavy)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.speaking{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}
.g-words .tile{min-height:110px;padding:10px 8px}
.g-words .tile .a{font-size:32px}
.g-words .tile .b{font-size:15px;color:var(--ink);font-weight:600}
.hidden-read .tile .b,.hidden-read .tile .m{visibility:hidden}
.hidden-read .tile.revealed .b,.hidden-read .tile.revealed .m{visibility:visible}

.syl-row{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:stretch}
.syl-head{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);font-family:var(--ar);font-size:30px;line-height:1.4}
.syl-head span{font-family:var(--bn);font-size:11.5px;color:var(--muted);line-height:1.1}
.syl-list{display:flex;flex-direction:column;gap:8px}

.detail{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.detail .big{font-family:var(--ar);font-size:88px;line-height:1.3;min-width:110px;text-align:center;background:var(--surface-2);border-radius:14px;border:1px solid var(--line)}
.detail .big.heavy{color:var(--heavy)}
.detail .nm{font-size:22px;font-weight:700}
.detail .nm .ar{font-size:24px;font-weight:400;color:var(--gold);margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14.5px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn .ar{font-size:20px;line-height:1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn svg{width:16px;height:16px;flex:none}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--heavy-soft);color:var(--heavy);font-weight:600}
.badge.g{background:var(--accent-soft);color:var(--accent)}

.forms{width:100%;border-collapse:collapse;direction:rtl;min-width:420px}
.forms th{font-size:12.5px;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--line);font-family:var(--bn)}
.forms td{text-align:center;font-family:var(--ar);font-size:32px;line-height:1.6;padding:2px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.forms td.bnn{font-family:var(--bn);font-size:14px;color:var(--muted)}
.forms tr:hover td{background:var(--surface-2)}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.rule{display:flex;flex-direction:column;gap:10px}
.ex{display:flex;flex-wrap:wrap;gap:8px}
.ex .tile{min-height:0;flex:1 1 140px;padding:8px 10px}
.ex .tile .a{font-size:30px}
.ex .tile .b{font-size:14px;color:var(--ink)}
.letters-inline{font-family:var(--ar);font-size:26px;direction:rtl;letter-spacing:.12em;line-height:1.7}

.done-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}

/* surahs */
.s-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.s-card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.s-card:hover{border-color:var(--accent)}
.s-card .t{font-weight:600}
.s-card .ar{font-size:24px;color:var(--gold);grid-row:span 2;align-self:center}
.s-card .d{font-size:13px;color:var(--muted)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer}
.tg input{accent-color:var(--accent);width:16px;height:16px}
.bism{text-align:center;font-family:var(--ar);font-size:30px;color:var(--accent);padding:6px 0}
.ayah{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,box-shadow .2s}
.ayah.playing{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.ayah-ar{font-family:var(--ar);direction:rtl;font-size:clamp(27px,6.4vw,34px);line-height:2.15;text-align:right}
.w{cursor:pointer;border-radius:8px;padding:0 3px;transition:background .15s;display:inline}
.w:hover{background:var(--accent-soft)}
.w.speaking{background:var(--gold-soft)}
.am{color:var(--gold);font-size:.8em;white-space:nowrap}
.ayah-bn{font-size:16.5px;font-weight:600;color:var(--accent)}
.ayah-tr{font-size:15px;color:var(--muted)}
.ayah-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.no-ucc .ayah-bn,.no-mean .ayah-tr{display:none}

/* quiz */
.q-box{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.q-prompt{text-align:center;padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.q-prompt .a{font-family:var(--ar);font-size:80px;line-height:1.4}
.q-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.q-opt{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;min-height:64px}
.q-opt .ar{font-size:36px;line-height:1.3}
.q-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.q-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.q-meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}

.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.calc input{width:90px;font:inherit;font-size:18px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.calc-out{font-size:18px;font-weight:600;color:var(--accent)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checklist li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.checklist .n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (max-width:480px){
  .detail{grid-template-columns:1fr}
  .detail .big{font-size:76px}
  .step{grid-template-columns:40px 1fr;padding:12px}
  .step-ar{display:none}
  .g-letters{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="bar"><div class="bar-in">
  <button class="back" id="backBtn" aria-label="পেছনে যান" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="bar-title" id="barTitle">Al-Quran Learner</div>
  <div class="speed" role="group" aria-label="পড়ার গতি">
    <button id="spSlow" aria-pressed="true">ধীরে</button>
    <button id="spNorm" aria-pressed="false">স্বাভাবিক</button>
  </div>
</div></header>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

  const c=bnCons(l), V=VOW[v];

function arSyl(l,v){
  if(v==='aa') return l==='أ'?'آ':l+'َا';
  if(v==='ii') return (l==='أ'?'إ':l)+'ِي';
  if(v==='uu') return l+'ُو';
  if(v==='i' && l==='أ') return 'إِ';
  if(v==='in' && l==='أ') return 'إٍ';
  return l+VOW[v].m;
}

const TTS = {ok:'speechSynthesis' in window, voice:null, rate:0.6, run:0, warned:false};
function pickVoice(){
  if(!TTS.ok) return;
  const vs = speechSynthesis.getVoices()||[];
  const ar = vs.filter(v=>/^ar([-_]|$)/i.test(v.lang));
  const sc = v => (/natural|online|neural|premium|enhanced/i.test(v.name)?4:0)+(/google/i.test(v.name)?2:0)+(/SA/i.test(v.lang)?1:0);
  ar.sort((a,b)=>sc(b)-sc(a));
  TTS.voice = ar[0]||null;
  const vs_el = document.getElementById('voiceStatus'); if(vs_el) renderVoiceStatus(vs_el);
}
if(TTS.ok){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; setTimeout(pickVoice,800); }

    if(!TTS.voice && !TTS.warned){ TTS.warned=true; toast('আরবি ভয়েস খুঁজে পাওয়া যায়নি — হোম পেজের নির্দেশনা দেখুন।',4000); }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanAr(text));
    u.lang = TTS.voice ? TTS.voice.lang : 'ar-SA';
    if(TTS.voice) u.voice = TTS.voice;
    u.rate = rate || TTS.rate;
    let done=false; const fin=()=>{ if(done) return; done=true; el&&el.classList.remove('speaking'); res(true); };
    u.onend = fin; u.onerror = fin;
    el && el.classList.add('speaking');
    setTimeout(()=>speechSynthesis.speak(u),40);
    setTimeout(fin, 3000 + text.length*260/(u.rate)); // safety if onend never fires
  });
}
function setRate(slow){ TTS.rate = slow?0.6:0.85; $('#spSlow').setAttribute('aria-pressed',slow); $('#spNorm').setAttribute('aria-pressed',!slow); store('aql-slow',slow); }
$('#spSlow').onclick=()=>setRate(true); $('#spNorm').onclick=()=>setRate(false);

   <label class="tg"><input type="checkbox" id="hideRead"> নিজে পড়ার অনুশীলন: উচ্চারণ লুকান (ছুঁয়ে মিলিয়ে দেখুন)</label>
   <div class="legend"><span><b>-</b> = টেনে পড়ুন</span><span><b>‘</b> = আইন (ع)-এর আওয়াজ</span><span><b>্</b> = থেমে মিলিয়ে পড়ুন</span></div>
   <div id="wordsWrap" class="stack">${WORDS.map(g=>`<div class="card rule"><h3>${g.lvl}</h3><div class="grid g-words">${g.list.map(w=>`<button class="tile" data-say="${w[0]}"><span class="a">${w[0]}</span><span class="b">${w[1]}</span><span class="m">${w[2]}</span></button>`).join('')}</div></div>`).join('')}</div>
   ${doneBar('l9')}</div>`;
  const cb=$('#hideRead');
  cb.onchange=()=>{ $('#wordsWrap').classList.toggle('hidden-read',cb.checked); app.querySelectorAll('.revealed').forEach(e=>e.classList.remove('revealed')); };
}

/* L10 quiz */
function lessonQuiz(){
  const pick = (arr,n)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)};
  let mode='see', q=0, score=0, cur=null, answered=false;
  const TOTAL=10;
  function makeQ(){
    if(mode==='syl'){
      const l=pick(SYL_LETTERS,1)[0], v=pick(['a','i','u','an','in','un','aa','ii','uu'],1)[0];
      const opts=new Map([[bnSyl(l,v),1]]);
      while(opts.size<4){ const l2=Math.random()<.5?l:pick(SYL_LETTERS,1)[0], v2=pick(['a','i','u','an','in','un','aa','ii','uu'],1)[0]; const k=bnSyl(l2,v2); if(!opts.has(k)) opts.set(k,0); }
      return {prompt:arSyl(l,v), say:arSyl(l,v), opts:pick([...opts.keys()],4), ans:bnSyl(l,v), arOpt:false};
    }
    const L=pick(LETTERS,1)[0]; const others=pick(LETTERS.filter(x=>x!==L),3);
    if(mode==='hear') return {prompt:null, say:L[1], opts:pick([L,...others],4).map(x=>x[0]), ans:L[0], arOpt:true};
    return {prompt:L[0], say:L[1], opts:pick([L,...others],4).map(x=>x[2]), ans:L[2], arOpt:false};
  }
  function render(){
    if(q>=TOTAL){
      const msg = score>=9?'চমৎকার! মাশাআল্লাহ।':score>=6?'ভালো হয়েছে! আরেকবার চেষ্টা করুন।':'আগের পাঠগুলো আরেকবার দেখে আবার চেষ্টা করুন।';
      $('#quiz').innerHTML=`<div class="q-prompt"><div style="font-size:40px;font-family:var(--disp)">${bnNum(score)}/${bnNum(TOTAL)}</div><p>${msg}</p></div><button class="btn primary" id="again" style="justify-content:center">আবার খেলুন</button>`;
      $('#again').onclick=()=>{q=0;score=0;next()}; return;
    }
    const title = mode==='hear'?'শুনে সঠিক হরফটি বাছাই করুন':mode==='see'?'হরফটির নাম কী?':'এটি কীভাবে পড়বেন?';
    $('#quiz').innerHTML = `<div class="q-meta"><span>প্রশ্ন ${bnNum(q+1)}/${bnNum(TOTAL)}</span><span>স্কোর: ${bnNum(score)}</span></div>
     <div class="q-prompt"><p style="font-weight:600">${title}</p>${cur.prompt?`<div class="a" lang="ar">${cur.prompt}</div>`:''}
     <button class="btn" data-say="${cur.say}">${I_PLAY} ${mode==='hear'?'আবার শুনুন':'শুনুন'}</button></div>
     <div class="q-opts">${cur.opts.map(o=>`<button class="q-opt" data-opt="${esc(o)}">${cur.arOpt?`<span class="ar">${o}</span>`:o}</button>`).join('')}</div>`;
    if(mode==='hear') setTimeout(()=>speak(cur.say),250);
  }
  function next(){ cur=makeQ(); answered=false; render(); }
  app.innerHTML = `<div class="stack"><p class="lead">প্রতিবার ১০টি প্রশ্ন। ভুল হলে সমস্যা নেই — সঠিক উত্তর দেখিয়ে দেওয়া হবে।</p>
   <div class="seg" role="group" aria-label="কুইজের ধরন">
    <button class="btn" data-mode="see">দেখে হরফের নাম</button>
    <button class="btn" data-mode="hear">শুনে হরফ চেনা</button>
    <button class="btn" data-mode="syl">হরকতসহ পড়া</button></div>
   <div class="card q-box" id="quiz"></div>${doneBar('l10')}</div>`;
  const setMode=m=>{mode=m;q=0;score=0;app.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('primary',b.dataset.mode===m));next();};
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
  $('#quiz').addEventListener('click',e=>{
    const b=e.target.closest('[data-opt]'); if(!b||answered) return; answered=true;
    const ok=b.dataset.opt===cur.ans; if(ok) score++;
    app.querySelectorAll('.q-opt').forEach(x=>{ if(x.dataset.opt===cur.ans) x.classList.add('right'); });
    if(!ok) b.classList.add('wrong');
    speak(cur.say);
    setTimeout(()=>{q++;next()}, ok?900:1800);
  });
  setMode('see');
}

/* L11 surahs */
function lessonSurahList(){
  app.innerHTML = `<div class="stack"><p class="lead">নামাজে সবচেয়ে বেশি পড়া হয় এমন ১২টি ছোট সূরা। প্রথমে আল-ফাতিহা, তারপর ক্রম অনুযায়ী এগোন। প্রতিটি শব্দ ছুঁয়ে আলাদা করে শুনতে পারবেন।</p>
   <div class="s-list">${SURAH_ORDER.map(n=>{const s=SURAH_DATA[n];return `<a class="s-card" href="#s${n}"><span class="t">${SURAH_BN[n]}</span><span class="ar">${s.ar}</span><span class="d">${bnNum(s.v.length)} আয়াত · ${SURAH_NOTE[n]}</span></a>`}).join('')}</div>
   ${doneBar('l11')}</div>`;
}
function surahView(n){
  const s=SURAH_DATA[n]; if(!s){ location.hash='l11'; return; }
  const opts = store('aql-opts')||{ucc:true,mean:true};
  const bism = n!==1 ? `<div class="bism" data-say="${SURAH_DATA[1].v[0][0]}" style="cursor:pointer">${SURAH_DATA[1].v[0][0]}</div>` : '';
  const i = SURAH_ORDER.indexOf(n), nx = SURAH_ORDER[i+1];
  app.innerHTML = `<div class="stack ${opts.ucc?'':'no-ucc'} ${opts.mean?'':'no-mean'}" id="sv">
   <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>${SURAH_BN[n]} <span class="small">(${s.bn})</span></h2><span class="ar" style="font-size:30px;color:var(--gold)">${s.ar}</span></div>
    <p class="small">সূরা নং ${bnNum(n)} · ${bnNum(s.v.length)} আয়াত · ${SURAH_NOTE[n]}</p>
    <div class="seg"><button class="btn primary" id="playS">${I_PLAY} পুরো সূরা শুনুন</button><button class="btn" id="stopS">${I_STOP} থামান</button>
    <a class="btn" href="https://quran.com/${n}" target="_blank" rel="noopener">${I_EXT} কারির তিলাওয়াত (quran.com)</a></div>
    <div class="toggles"><label class="tg"><input type="checkbox" id="tUcc" ${opts.ucc?'checked':''}> বাংলা উচ্চারণ</label><label class="tg"><input type="checkbox" id="tMean" ${opts.mean?'checked':''}> বাংলা অর্থ</label></div>
   </div>
   <p class="small">প্রতিটি শব্দে ছুঁয়ে শুনুন। প্রথমে উচ্চারণ দেখে পড়ুন, তারপর “বাংলা উচ্চারণ” বন্ধ করে শুধু আরবি দেখে পড়ার চেষ্টা করুন।</p>
   ${bism}
   ${s.v.map((v,k)=>`<article class="ayah" data-ay="${k}">
     <div class="ayah-ar" lang="ar">${v[0].split(' ').map(w=>`<span class="w" data-say="${esc(w)}">${w}</span>`).join(' ')} <span class="am">﴿${arNum(k+1)}﴾</span></div>
     <div class="ayah-bn">${UCC[n][k]}</div>
     <div class="ayah-tr">${bnNum(k+1)}. ${v[1]}</div>
     <div class="ayah-foot"><button class="btn" data-ayplay="${k}">${I_PLAY} আয়াত শুনুন</button></div></article>`).join('')}
   <div class="done-bar"><a class="btn" href="#l11">← সব সূরা</a>${nx?`<a class="btn primary" href="#s${nx}">পরের সূরা: ${SURAH_BN[nx]} →</a>`:''}</div></div>`;
  const saveOpts=()=>{opts.ucc=$('#tUcc').checked;opts.mean=$('#tMean').checked;store('aql-opts',opts);$('#sv').classList.toggle('no-ucc',!opts.ucc);$('#sv').classList.toggle('no-mean',!opts.mean);};
  $('#tUcc').onchange=saveOpts; $('#tMean').onchange=saveOpts;
  const playAy = async (k,run)=>{ const el=app.querySelector(`[data-ay="${k}"]`); el.classList.add('playing'); el.scrollIntoView({block:'center',behavior:'smooth'}); await speak(s.v[k][0], null); el.classList.remove('playing'); return run===TTS.run; };
  app.querySelectorAll('[data-ayplay]').forEach(b=>b.onclick=()=>{stopSpeech(); playAy(+b.dataset.ayplay, TTS.run);});
  $('#playS').onclick=async()=>{ stopSpeech(); const run=TTS.run; for(let k=0;k<s.v.length;k++){ if(!(await playAy(k,run))) return; await new Promise(r=>setTimeout(r,350)); if(run!==TTS.run) return; } };
  $('#stopS').onclick=stopSpeech;
}

/* L12 khatm */
function lessonKhatm(){
  app.innerHTML = `<div class="stack"><p class="lead">আলহামদুলিল্লাহ! হরফ, হরকত, তাজবীদ আর ছোট সূরা শিখে আপনি এখন কুরআন শরীফ দেখে পড়ার জন্য প্রস্তুত। পুরো কুরআনে <b>৩০ পারা, ১১৪ সূরা, প্রায় ৬০৪ পৃষ্ঠা</b>।</p>
   <div class="card rule"><h2>আপনার খতমের হিসাব</h2>
    <div class="calc"><label for="ppd">প্রতিদিন পড়বো</label><input id="ppd" type="number" min="1" max="100" value="4"><span>পৃষ্ঠা</span></div>
    <p class="calc-out" id="calcOut"></p>
    <p class="small">উদাহরণ: প্রতি ওয়াক্ত নামাজের পর ৪ পৃষ্ঠা = দিনে ২০ পৃষ্ঠা = ১ পারা → প্রায় ৩০ দিনে এক খতম।</p></div>
   <div class="card rule"><h2>ধাপে ধাপে পথ</h2><ul class="checklist">
    <li><span class="n">১</span><span>এই অ্যাপের ১–১০ পাঠ ভালো করে শেষ করুন, কুইজে ১০-এ ৯ পান।</span></li>
    <li><span class="n">২</span><span>১২টি সূরা শব্দে শব্দে পড়ুন, তারপর উচ্চারণ বন্ধ করে শুধু আরবি দেখে পড়ুন।</span></li>
    <li><span class="n">৩</span><span>একটি কুরআন শরীফ নিন (বাংলাদেশে প্রচলিত ১৫ লাইনের হাফেজি কুরআন বা উসমানি লিপি)। ৩০তম পারা (আম্মা পারা) দিয়ে শুরু করুন — এখানেই ছোট সূরাগুলো আছে।</span></li>
    <li><span class="n">৪</span><span>প্রতিদিন নির্দিষ্ট সময়ে পড়ুন, যেমন ফজরের পরে। অল্প হলেও নিয়মিত পড়া সবচেয়ে জরুরি।</span></li>
    <li><span class="n">৫</span><span>সপ্তাহে অন্তত একবার কোনো হাফেজ/ইমাম বা জানা কাউকে পড়ে শোনান — ভুল ধরিয়ে দেবেন।</span></li>
    <li><span class="n">৬</span><span>আম্মা পারার পর প্রথম পারা থেকে শুরু করে ধারাবাহিকভাবে খতম করুন।</span></li>
    <li><span class="n">৭</span><span>যে আয়াতটি কঠিন লাগে, quran.com-এ কারির তিলাওয়াত শুনে তারপর পড়ুন।</span></li></ul></div>
   <div class="tip">রাসূলুল্লাহ ﷺ বলেছেন: যে ব্যক্তি কুরআনের একটি হরফ পড়ে, সে একটি নেকি পায়, আর প্রতিটি নেকি দশ গুণ। (তিরমিযি ২৯১০) — আর যে কষ্ট করে আটকে আটকে পড়ে, তার জন্য দ্বিগুণ সওয়াব। (বুখারি ৪৯৩৭, মুসলিম ৭৯৮)</div>
   ${doneBar('l12')}</div>`;
  const upd=()=>{ const p=Math.max(1,Math.min(604,+$('#ppd').value||1)); const d=Math.ceil(604/p); const m=d/30;
    $('#calcOut').textContent = `প্রায় ${bnNum(d)} দিনে খতম` + (d>=45?` (≈ ${bnNum(m.toFixed(1))} মাস)`:''); };
  $('#ppd').oninput=upd; upd();
}

/* ---------- router ---------- */
function route(){
  stopSpeech();
  const h = location.hash.slice(1)||'home';
  const back=$('#backBtn'), title=$('#barTitle');
  window.scrollTo(0,0);
  if(h.startsWith('s') && SURAH_DATA[+h.slice(1)]){ const n=+h.slice(1); back.hidden=false; back.dataset.to='l11'; title.textContent='সূরা '+SURAH_BN[n]; surahView(n); return; }
  const L = LESSONS.find(l=>l.id===h);
  if(L){ back.hidden=false; back.dataset.to='home'; title.textContent=`পাঠ ${bnNum(LESSONS.indexOf(L)+1)} · ${L.t}`; L.r(); return; }
  back.hidden=true; title.textContent='Al-Quran Learner'; home();
}
$('#backBtn').onclick=()=>{ location.hash = $('#backBtn').dataset.to||'home'; };
window.addEventListener('hashchange',route);
route();
</script>
